services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-importsap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-importsap}
      POSTGRES_DB: ${POSTGRES_DB:-importsap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5431}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-importsap} -d ${POSTGRES_DB:-importsap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - import_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    command:
      - "rq"
      - "worker"
      - "--url"
      - "redis://redis:6379/0"
      - "import:notification"
      - "import:work_order"
      - "import:measuring_document"
      - "import:measuring_point"
      - "import:equipment"
      - "import:functional_location"
    volumes:
      - import_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-importsap}
      PGPASSWORD: ${POSTGRES_PASSWORD:-importsap}
      PGDATABASE: ${POSTGRES_DB:-importsap}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  import_uploads:
