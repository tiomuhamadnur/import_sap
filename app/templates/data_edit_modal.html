{% import "_macros.html" as m %}
<div class="flex items-center justify-between border-b border-slate-100 px-6 py-4">
  <div>
    <h3 class="text-base font-semibold text-slate-900">Edit {{ view.title }}</h3>
    <p class="text-sm text-slate-500">{{ record|attr(view.key_field) }}</p>
  </div>
  <button type="button" @click="$dispatch('close-edit-modal')"
          class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="Close">
    {{ m.icon("x", "h-5 w-5") }}
  </button>
</div>
<div class="p-6">
  {% if error %}<div class="mb-4">{{ m.alert("error", "Could not save", error) }}</div>{% endif %}
  {% include "_data_edit_form.html" %}
</div>
